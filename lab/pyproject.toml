[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantguard-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.104", "uvicorn>=0.24", "httpx>=0.25", "pydantic>=2.5", "PyYAML>=6"]

[tool.setuptools]
packages = ["tenantguard_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
