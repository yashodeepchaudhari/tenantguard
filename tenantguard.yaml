# Every tunable lives here. Never hard-code these in services.
layout: layouts/ag23.json

# Server name -> base URL. Local dev defaults; docker-compose overrides via TENANTGUARD_WORKER_URLS.
workers:
  w0: http://127.0.0.1:8100
  w1: http://127.0.0.1:8101
  w2: http://127.0.0.1:8102
  w3: http://127.0.0.1:8103
  w4: http://127.0.0.1:8104
  w5: http://127.0.0.1:8105
  w6: http://127.0.0.1:8106
  w7: http://127.0.0.1:8107
  w8: http://127.0.0.1:8108
  spare: http://127.0.0.1:8109
  quarantine: http://127.0.0.1:8110

services:
  gateway: http://127.0.0.1:8000
  brain: http://127.0.0.1:8200
  lab: http://127.0.0.1:8300
  handoff: http://127.0.0.1:8400
  billing: http://127.0.0.1:8600
  narrator: http://127.0.0.1:8700

tiers:
  enterprise:
    weight: 4
    quota: {rate_rps: 100, burst: 200, cost_ms_per_s: 600, concurrency: 16}
  pro:
    weight: 2
    quota: {rate_rps: 50, burst: 100, cost_ms_per_s: 300, concurrency: 8}
  free:
    weight: 1
    quota: {rate_rps: 20, burst: 40, cost_ms_per_s: 150, concurrency: 4}

gateway:
  default_mode: tenantguard
  tick_ms: 250
  max_queue_wait_ms: {interactive: 1000, batch: 5000}
  cost_bucket_s: 2              # cost bucket capacity = cost_ms_per_s * this
  express_cost_ms: 5            # classes cheaper than this skip ahead
  fail_static_after_s: 2
  batch_routes: ["/api/export"]
  upstream_timeout_s: 30
  ttl_max_s: 3600               # control overrides: 0 < ttl_s <= this and finite, else 400
  quota_max: {rate_rps: 10000, burst: 20000, cost_ms_per_s: 100000, concurrency: 1024}   # PATCH/POST bounds (finite, >0, <= these)
  retry_budget: {ratio: 0.1, window_s: 10, min_allowed: 3}   # retries allowed <= max(min_allowed, ratio * first attempts in window); else 429 retry_budget
  limiter: {min_window: 2, max_window: 64, initial_window: 8}

worker:
  cpus: 0.5
  mem_limit_mb: 256
  body_limit_bytes: 1048576
  tenant_mem_budget_mb: 32
  cache_mb: 8
  cache_guaranteed_share: 0.125   # per-tenant guaranteed slice of the cache
  bg_threads: 4
  seed_rows: 1000
  blackbox: {cpu_ms_per_doc: 2.0, queue_max: 5000}
  max_request_s: 30             # any single request (e.g. /api/export) must finish within this
  bg_pending: {per_tenant: 200, total: 1000}   # background-job backlog caps (503 bg_backlog)
  mem_baseline_mb: 80           # RSS reserved for the process; worker-wide memory cap = mem_limit_mb - this
  memory_trim_s: 30            # periodic malloc_trim on glibc
  max_classes_per_tenant: 256   # per-tenant class meters; overflow folds into "other"

brain:
  tick_ms: 250
  stats_poll_s: 1.0
  # Stage 2: usage-share detector + throttle ladder
  noisy:
    warn: 1.5
    throttle: 2.0
    quarantine: 4.0
    recover_below: 1.0
    hold_s: {warn: 5, throttle: 2, deprioritize: 4, quarantine: 6, recover: 10}
    throttle_factor: 0.5        # AIMD multiplicative decrease
    recover_step: 0.1           # additive increase per recovery tick
    min_victim_impact: 0.2      # neighbours must be hurt at least this much before anyone is flagged
    baseline_alpha: 0.05        # (legacy, per-frame) superseded by baseline_half_life_s
    baseline_half_life_s: 60    # time-based EWMA for the calm baseline p95; frozen while a neighbour over-uses
    hold_ratio: 0.8             # a level holds if >= this share of ticks in the hold window are above threshold
    recover_tick_s: 1.0
    throttle_floor: 0.25        # lowest factor reached by AIMD before deprioritize
    deprioritize_weight: 0.25
    quarantine_factor: 0.1
    quarantine_weight: 0.1
    victim_window_s: 5.0        # victim latency is a sustained statistic over this window
    victim_quantile: 0.3        # quantile of per-tick p95 (robust to short CPU-quota stalls)
    victim_min_ticks: 4
    victim_abs_ms: 8.0          # a victim must be at least this much above its baseline
    over_use: 1.6               # flag only above this multiple of the fair share
    min_hurt_neighbours: 4      # ... and only when at least this many neighbours are hurt
  # Stage 3: TenantGuard (calibrated at H3-H4)
  health:
    probe_window_ticks: 8
    slow_peer_ratio: 1.6
    slow_abs_ms: 8
    open_after_ticks: 4         # naming debounce (Stage 3); server persistence is open_hold_s
    window_s: 5.0
    level_quantile: 0.3         # cell level = this quantile of per-tick p95 over window_s
    open_hold_s: 4.0            # a server opens only after this long with >= hold_ratio slow ticks
    heal_hold_s: 2.0
    hold_ratio: 0.8
    min_slow_ms: 25.0           # never "slow" below this absolute level ...
    sla_fraction: 0.5           # ... nor below this fraction of the strictest tenant SLA on the server
    min_cell_requests: 5
    min_tenants: 2
    canary_s: 1.0
    min_canaries: 3
    canary_window_s: 6.0
    canary_abs_ms: 8.0          # canaries can keep a slow server open, never open one
  rescue_capacity_guard: 0.7
  confidence_to_prove: 0.8
  spare_sizing: 1.25
  prove_settle_s: 2
  prove_window_s: 6
  recovery_R: 0.5
  paid_share_costly: 0.35
  host_idle_ratio: 1.5
  ttl_s: {relocate: 120, quarantine: 120, throttle: 60, probation: 300}   # probation: reserved, not read yet
  action_budget: {relocations_per_min: 6, quarantine_every_s: 30, max_drained: 1, drain_peer_busy: 0.75}
  prover: auto                  # auto | docker | null (env TENANTGUARD_PROVER wins)
  charge_s: 1.0                 # background-CPU charge period
  decoder: {k: 8, w_min: 4, w_mean: 2, w_stuck: 1, w_ledger: 2, w_host: 4, w_none: 3, temperature: 1.0, min_confidence: 0.5, max_culprits: 2, host_p: 0.5}
  verdicts: {over_plan_rejected_share: 0.2, harm_follow_share: 0.3, harm_follow_ratio: 1.6, evidence_hint: 0.3, repeat_count: 3, repeat_window_s: 600}

handoff:
  decision_window_s: 120      # deadline given to the on-call for a pending action
  block_s: 300                # duration of an approved block (always TTL-bound)
  extend_s: 120
  push_timeout_s: 3
  retention_s: 3600            # evict closed/resolved cases this long after they close
  history_wire_max: 50         # history items sent to the partner per case (+ "N earlier events")
  history_keep: 500            # history items kept in memory per case
  id_map_max: 2000             # persisted incident->case id map cap (live cases never dropped)

billing:
  poll_s: 5                      # worker /stats + brain /api/incidents poll
  bucket_s: 60                   # metering bucket
  retention_h: 24
  price_rs_per_cpu_s: {enterprise: 0.40, pro: 0.60, free: 0.80}
  db_price_rs_per_s: 0.0
  ref_alpha: 0.2                 # EWMA weight of a calm bucket in the reference cost
  sla_default_p95_ms: 100
  sla_credit_table: [{min_violation_s: 2, pct: 2}, {min_violation_s: 10, pct: 4}, {min_violation_s: 60, pct: 10}, {min_violation_s: 300, pct: 25}]   # pct of the period's usage subtotal
  unmetered_min_confidence: 0.6

narrator:
  max_reports: 200            # reports kept in memory (newest first)
