# Owned by the coordinator. Tasks own their own Dockerfile; ask before editing this file.
# Build context is the repo root so every image can install ./common.
#
# v2: there are no fixed workers. The brain starts each project's replicas from the worker image through the
# Docker Engine API (docker.sock), on this stack's network, labelled tg.stack=<COMPOSE_PROJECT>.
#   docker compose --profile image build worker      # build the replica image once (tenantguard-worker:latest)
#   docker compose up -d                              # gateway + brain; the brain starts the warm replicas

services:
  worker:                         # image only: never started by compose; the brain starts replicas from it
    build: {context: ., dockerfile: worker/Dockerfile}
    image: ${TENANTGUARD_WORKER_IMAGE:-tenantguard-worker:latest}
    profiles: ["image"]

  gateway:
    build: {context: ., dockerfile: gateway/Dockerfile}
    ports: ["${GATEWAY_PORT:-8000}:8000"]
    environment:
      TENANTGUARD_ROOT: /app
      TENANTGUARD_BRAIN_URL: http://brain:8200
      TENANTGUARD_CONTROL_TOKEN: ${TENANTGUARD_CONTROL_TOKEN:-dev}
      TENANTGUARD_CORS_ORIGINS: ${TENANTGUARD_UI_ORIGINS:-http://127.0.0.1:5173}

  brain:
    build: {context: ., dockerfile: brain/Dockerfile}
    ports: ["${BRAIN_PORT:-8200}:8200"]
    environment:
      TENANTGUARD_ROOT: /app
      TENANTGUARD_GATEWAY_URL: http://gateway:8000
      TENANTGUARD_CONTROL_TOKEN: ${TENANTGUARD_CONTROL_TOKEN:-dev}
      TENANTGUARD_CORS_ORIGINS: ${TENANTGUARD_UI_ORIGINS:-http://127.0.0.1:5173}
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-codeastra}
      TENANTGUARD_BACKEND: docker
      TENANTGUARD_WORKER_IMAGE: ${TENANTGUARD_WORKER_IMAGE:-tenantguard-worker:latest}
      TENANTGUARD_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-codeastra}_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock     # privileged: only the brain mounts it (docs/v2/08 R6)
      - brain-state:/app/brain/.state                   # registry.json + events.jsonl
    depends_on: [gateway]

  handoff:
    build: {context: ., dockerfile: integrations/handoff/Dockerfile}
    ports: ["${HANDOFF_PORT:-8400}:8400"]
    environment:
      TENANTGUARD_ROOT: /app
      TENANTGUARD_BRAIN_URL: http://brain:8200
      TENANTGUARD_GATEWAY_URL: http://gateway:8000
      TENANTGUARD_CONTROL_TOKEN: ${TENANTGUARD_CONTROL_TOKEN:-dev}
      TENANTGUARD_UI_URL: ${TENANTGUARD_UI_URL:-http://127.0.0.1:5173}
      WEB_URL: ${WEB_URL:-http://127.0.0.1:8500}
      HANDOFF_STATE_PATH: /data/handoff-state.json
      HANDOFF_PARTNER_TOKEN: ${HANDOFF_PARTNER_TOKEN:-}
    volumes: ["handoff-data:/data"]
    depends_on: [brain]
    profiles: ["handoff"]

  narrator:
    build: {context: ., dockerfile: narrator/Dockerfile}
    ports: ["${NARRATOR_PORT:-8700}:8700"]
    environment:
      TENANTGUARD_ROOT: /app
      TENANTGUARD_BRAIN_URL: http://brain:8200
      TENANTGUARD_CORS_ORIGINS: ${TENANTGUARD_UI_ORIGINS:-http://127.0.0.1:5173}
    depends_on: [brain]
    profiles: ["narrator"]

  billing:
    build: {context: ., dockerfile: billing/Dockerfile}
    ports: ["${BILLING_PORT:-8600}:8600"]
    environment:
      TENANTGUARD_ROOT: /app
      TENANTGUARD_BRAIN_URL: http://brain:8200
      TENANTGUARD_GATEWAY_URL: http://gateway:8000
      TENANTGUARD_CONTROL_TOKEN: ${TENANTGUARD_CONTROL_TOKEN:-dev}
      TENANTGUARD_CORS_ORIGINS: ${TENANTGUARD_UI_ORIGINS:-http://127.0.0.1:5173}
    depends_on: [brain, gateway]
    profiles: ["billing"]

  lab:
    build: {context: ., dockerfile: lab/Dockerfile}
    ports: ["${LAB_PORT:-8300}:8300"]
    environment:
      TENANTGUARD_ROOT: /app
      TENANTGUARD_GATEWAY_URL: http://gateway:8000
      TENANTGUARD_BRAIN_URL: http://brain:8200
      TENANTGUARD_CONTROL_TOKEN: ${TENANTGUARD_CONTROL_TOKEN:-dev}
      TENANTGUARD_UI_ORIGINS: ${TENANTGUARD_UI_ORIGINS:-http://127.0.0.1:5173}
    depends_on: [gateway]
    profiles: ["lab"]

volumes:
  handoff-data:
  brain-state:
