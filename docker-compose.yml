# Owned by the coordinator. Tasks own their own Dockerfile; ask before editing this file.
# Build context is the repo root so every image can install ./common.
x-worker: &worker
  build: {context: ., dockerfile: worker/Dockerfile}
  cpus: 0.5
  mem_limit: 256m
  pids_limit: 128
  restart: unless-stopped
  environment: &worker-env
    TENANTGUARD_ROOT: /app

x-worker-urls: &worker-urls >-
  w0=http://w0:8100,w1=http://w1:8100,w2=http://w2:8100,w3=http://w3:8100,w4=http://w4:8100,w5=http://w5:8100,w6=http://w6:8100,w7=http://w7:8100,w8=http://w8:8100,spare=http://spare:8100,quarantine=http://quarantine:8100

services:
  w0: {<<: *worker, environment: {<<: *worker-env, SERVER_NAME: w0}}
  w1: {<<: *worker, environment: {<<: *worker-env, SERVER_NAME: w1}}
  w2: {<<: *worker, environment: {<<: *worker-env, SERVER_NAME: w2}}
  w3: {<<: *worker, environment: {<<: *worker-env, SERVER_NAME: w3}}
  w4: {<<: *worker, environment: {<<: *worker-env, SERVER_NAME: w4}}
  w5: {<<: *worker, environment: {<<: *worker-env, SERVER_NAME: w5}}
  w6: {<<: *worker, environment: {<<: *worker-env, SERVER_NAME: w6}}
  w7: {<<: *worker, environment: {<<: *worker-env, SERVER_NAME: w7}}
  w8: {<<: *worker, environment: {<<: *worker-env, SERVER_NAME: w8}}
  spare:
    <<: *worker
    cpus: 1.0
    environment: {<<: *worker-env, SERVER_NAME: spare}
  quarantine:
    <<: *worker
    cpus: 0.25
    mem_limit: 128m
    environment: {<<: *worker-env, SERVER_NAME: quarantine}

  gateway:
    build: {context: ., dockerfile: gateway/Dockerfile}
    ports: ["8000:8000"]
    environment:
      TENANTGUARD_ROOT: /app
      TENANTGUARD_WORKER_URLS: *worker-urls
      TENANTGUARD_CONTROL_TOKEN: ${TENANTGUARD_CONTROL_TOKEN:-dev}
      TENANTGUARD_CORS_ORIGINS: ${TENANTGUARD_UI_ORIGINS:-http://127.0.0.1:5173}
    depends_on: [w0, w1, w2, w3, w4, w5, w6, w7, w8, spare, quarantine]

  brain:
    build: {context: ., dockerfile: brain/Dockerfile}
    ports: ["8200:8200"]
    environment:
      TENANTGUARD_ROOT: /app
      TENANTGUARD_WORKER_URLS: *worker-urls
      TENANTGUARD_GATEWAY_URL: http://gateway:8000
      TENANTGUARD_CONTROL_TOKEN: ${TENANTGUARD_CONTROL_TOKEN:-dev}
      TENANTGUARD_CORS_ORIGINS: ${TENANTGUARD_UI_ORIGINS:-http://127.0.0.1:5173}
      COMPOSE_PROJECT: codeastra
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [gateway]

  lab:
    build: {context: ., dockerfile: lab/Dockerfile}
    ports: ["8300:8300"]
    environment:
      TENANTGUARD_ROOT: /app
      TENANTGUARD_GATEWAY_URL: http://gateway:8000
      TENANTGUARD_BRAIN_URL: http://brain:8200
      TENANTGUARD_WORKER_URLS: *worker-urls
      TENANTGUARD_CONTROL_TOKEN: ${TENANTGUARD_CONTROL_TOKEN:-dev}
      TENANTGUARD_UI_ORIGINS: ${TENANTGUARD_UI_ORIGINS:-http://127.0.0.1:5173}
    depends_on: [gateway]
    profiles: ["lab"]
